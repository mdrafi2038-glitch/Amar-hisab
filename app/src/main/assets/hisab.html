<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আজকের হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E6;--paper-2:#EFE8D9;--ink:#26241F;--ink-soft:#6B6558;--line:#C9BFA6;--red:#9B3A2E;--gold:#A9821F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1E1C18;--paper-2:#252220;--ink:#EDE6D6;--ink-soft:#B4AB98;--line:#4A4638;--red:#D9776A;--gold:#D8B65C}}
*{box-sizing:border-box}html,body{height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hind Siliguri',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}.wrap{max-width:640px;margin:0 auto;padding:28px 20px 64px;position:relative}.binding{position:absolute;left:0;top:0;bottom:0;width:22px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:60px 0}.binding span{width:7px;height:7px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line)}header{padding-left:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}h1{font-family:'Tiro Bangla',serif;font-weight:400;font-size:2rem;margin:0;letter-spacing:.2px}.today-date{color:var(--ink-soft);font-size:.92rem;white-space:nowrap;padding-bottom:4px}.card{padding-left:26px}form.entry{display:flex;gap:8px;margin-bottom:20px}form.entry input{font-family:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--paper-2);color:var(--ink)}form.entry input::placeholder{color:var(--ink-soft)}#nameInput{flex:1 1 auto;min-width:0}#amountInput{width:110px}form.entry button{font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:1rem;padding:10px 18px;border:none;border-radius:3px;background:var(--ink);color:var(--paper);cursor:pointer}form.entry button:active{opacity:.75}.list{list-style:none;margin:0 0 18px;padding:0}.list li{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}.list li .who{font-weight:500;flex:0 0 auto}.list li .fill{flex:1 1 auto;border-bottom:1px dotted var(--line);height:1px;transform:translateY(-5px);min-width:12px}.list li .amt{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}.list li .del{flex:0 0 auto;background:none;border:none;color:var(--ink-soft);font-size:.85rem;cursor:pointer;padding:2px 4px}.empty{color:var(--ink-soft);font-style:italic;padding:18px 0;border-bottom:1px dashed var(--line)}.totalRow{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin:18px 0 30px}.stamp{border:3px solid var(--red);color:var(--red);border-radius:50%;width:108px;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-6deg);font-family:'Tiro Bangla',serif;text-align:center;flex:0 0 auto}.stamp .label{font-size:.68rem;letter-spacing:.5px}.stamp .value{font-size:1.15rem;font-weight:400;line-height:1.1;margin-top:2px}.actions{display:flex;gap:10px;padding-left:26px;flex-wrap:wrap}.actions button{font-family:'Hind Siliguri',sans-serif;font-size:.92rem;padding:9px 16px;border-radius:3px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}.actions button.primary{background:var(--ink);color:var(--paper)}details.history{margin-top:36px;padding-left:26px;border-top:2px solid var(--ink);padding-top:14px}details.history summary{cursor:pointer;font-family:'Tiro Bangla',serif;font-size:1.15rem;margin-bottom:8px}.hist-day{padding:10px 0;border-bottom:1px dashed var(--line)}.hist-day .hist-head{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:.88rem;margin-bottom:4px}.hist-day .hist-head b{color:var(--ink);font-weight:600}footer.note{padding-left:26px;margin-top:26px;color:var(--ink-soft);font-size:.82rem}@media (max-width:420px){#amountInput{width:88px}.stamp{width:92px;height:92px}}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px;z-index:50}.modal-overlay.open{display:flex}.modal-box{background:var(--paper);border:1px solid var(--line);border-radius:6px;max-width:420px;width:100%;padding:20px;max-height:85vh;overflow:auto}.modal-title{font-family:'Tiro Bangla',serif;font-size:1.2rem;margin-bottom:6px}.modal-hint{color:var(--ink-soft);font-size:.85rem;margin:0 0 12px}#receiptText{width:100%;min-height:220px;font-family:'Hind Siliguri',sans-serif;font-size:.95rem;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--paper-2);color:var(--ink);resize:vertical;white-space:pre}.modal-status{min-height:20px;font-size:.85rem;color:var(--gold);margin-top:6px}.modal-buttons{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.modal-buttons button{font-family:'Hind Siliguri',sans-serif;font-size:.92rem;padding:9px 16px;border-radius:3px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}.modal-buttons button.primary{background:var(--ink);color:var(--paper)}.print-stamp{display:none}@page{size:80mm auto;margin:2mm 3mm}@media print{html,body{background:#fff;color:#000;width:74mm}body{font-size:11px;line-height:1.35}.binding,form.entry,.actions,details.history,footer.note,.list li .del,.modal-overlay{display:none!important}.wrap{max-width:74mm;width:74mm;padding:0;margin:0}header{padding-left:0;flex-direction:column;align-items:center;gap:2px;text-align:center;border-bottom:1px dashed #000;padding-bottom:6px;margin-bottom:8px}h1{font-size:1.05rem}.today-date{font-size:.75rem}.print-stamp{display:block;text-align:center;font-size:.72rem;color:#000;margin:-2px 0 8px}.card{padding-left:0}.list li{padding:5px 0;border-bottom:1px dashed #000}.list li .fill{border-bottom-color:#000}.list li .who,.list li .amt{font-size:.8rem}.totalRow{justify-content:center;margin:10px 0 4px;border-top:1px dashed #000;padding-top:8px}.stamp{border:none;transform:none;width:auto;height:auto;flex-direction:row;gap:6px}.stamp .label{font-size:.8rem}.stamp .value{font-size:1rem;font-weight:700}}
</style>
</head>
<body>
<div class="wrap"><div class="binding" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<header><h1>আজকের হিসাব</h1><div class="today-date" id="dateLabel"></div></header><div class="print-stamp" id="printStamp"></div>
<div class="card"><form class="entry" id="entryForm" autocomplete="off"><input type="text" id="nameInput" placeholder="নাম" required><input type="text" id="amountInput" placeholder="৳ টাকা" inputmode="decimal" required><button type="submit">যোগ করুন</button></form><ul class="list" id="list"></ul><div class="totalRow"><div class="stamp"><span class="label">মোট আজ</span><span class="value" id="totalValue">৳০</span></div></div></div>
<div class="actions"><button type="button" class="primary" id="printBtn">প্রিন্ট করুন</button><button type="button" id="rawbtBtn">RawBT দিয়ে সরাসরি প্রিন্ট</button><button type="button" id="textBtn">টেক্সট দেখুন / কপি করুন</button><button type="button" id="clearBtn">আজকের তালিকা মুছুন</button></div>
<details class="history"><summary>আগের দিনগুলোর হিসাব</summary><div id="historyList"></div></details><footer class="note">এই তালিকা শুধু আপনার এই ব্রাউজারে সংরক্ষিত থাকে।</footer></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box"><div class="modal-title">হিসাবের টেক্সট</div><p class="modal-hint">এই টেক্সট কপি করে আপনার থার্মাল প্রিন্টার অ্যাপে (যেমন RawBT) পেস্ট করে প্রিন্ট করুন।</p><textarea id="receiptText" readonly></textarea><div class="modal-status" id="modalStatus"></div><div class="modal-buttons"><button type="button" id="copyBtn" class="primary">সব কপি করুন</button><button type="button" id="closeModalBtn">বন্ধ করুন</button></div></div></div>
<script>
(function(){
const STORAGE_KEY='hisab_by_date_v1';
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formatDateLabel(key){const months=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];const[y,m,d]=key.split('-').map(Number);return toBanglaNum(d)+' '+months[m-1]+' '+toBanglaNum(y)}
function loadAll(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):{}}catch(e){return {}}}
function saveAll(data){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}}
const banglaDigits=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBanglaNum(str){return String(str).replace(/[0-9]/g,d=>banglaDigits[d])}
function toEnglishNum(str){return String(str).replace(/[০-৯]/g,d=>String(banglaDigits.indexOf(d)))}
function fmtAmt(n){n=Number(n);let s=(Math.round(n*100)/100).toString();return '৳'+toBanglaNum(s)}
const key=todayKey();let data=loadAll();if(!data[key])data[key]=[];
const listEl=document.getElementById('list'),totalEl=document.getElementById('totalValue'),dateLabelEl=document.getElementById('dateLabel'),historyEl=document.getElementById('historyList');dateLabelEl.textContent=formatDateLabel(key);
function render(){const entries=data[key]||[];listEl.innerHTML='';if(entries.length===0){const li=document.createElement('li');li.className='empty';li.textContent='এখনও কোনো এন্ট্রি নেই। উপরে নাম আর টাকার পরিমাণ দিন।';listEl.appendChild(li)}else{entries.forEach((e,i)=>{const li=document.createElement('li');li.innerHTML='<span class="who"></span><span class="fill"></span><span class="amt"></span><button class="del" aria-label="মুছুন">✕</button>';li.querySelector('.who').textContent=e.name;li.querySelector('.amt').textContent=fmtAmt(e.amount);li.querySelector('.del').addEventListener('click',()=>{entries.splice(i,1);saveAll(data);render()});listEl.appendChild(li)})}const total=entries.reduce((s,e)=>s+Number(e.amount||0),0);totalEl.textContent=fmtAmt(total);renderHistory()}
function renderHistory(){const keys=Object.keys(data).filter(k=>k!==key&&(data[k]||[]).length>0).sort().reverse();historyEl.innerHTML='';if(keys.length===0){const p=document.createElement('div');p.className='hist-day';p.style.color='var(--ink-soft)';p.style.fontStyle='italic';p.textContent='আগের কোনো দিনের হিসাব নেই।';historyEl.appendChild(p);return}keys.forEach(k=>{const entries=data[k],total=entries.reduce((s,e)=>s+Number(e.amount||0),0),div=document.createElement('div');div.className='hist-day';const names=entries.map(e=>e.name+' ('+fmtAmt(e.amount)+')').join(', ');div.innerHTML='<div class="hist-head"><span>'+formatDateLabel(k)+'</span><b>'+fmtAmt(total)+'</b></div><div>'+names+'</div>';historyEl.appendChild(div)})}
document.getElementById('entryForm').addEventListener('submit',function(ev){ev.preventDefault();const nameInput=document.getElementById('nameInput'),amountInput=document.getElementById('amountInput'),name=nameInput.value.trim(),amount=parseFloat(toEnglishNum(amountInput.value).replace(/[^0-9.]/g,''));if(!name||isNaN(amount)||amount<0)return;data[key].push({name,amount});saveAll(data);nameInput.value='';amountInput.value='';nameInput.focus();render()});
function updatePrintStamp(){const now=new Date(),months=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];const dateStr=toBanglaNum(now.getDate())+' '+months[now.getMonth()]+' '+toBanglaNum(now.getFullYear());let h=now.getHours(),ampm=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;const mm=String(now.getMinutes()).padStart(2,'0');document.getElementById('printStamp').textContent='প্রিন্ট করা হয়েছে: '+dateStr+', '+toBanglaNum(h)+':'+toBanglaNum(mm)+' '+ampm}
window.addEventListener('beforeprint',updatePrintStamp);
function buildReceiptText(){const entries=data[key]||[],now=new Date(),months=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];let h=now.getHours(),ampm=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;const mm=String(now.getMinutes()).padStart(2,'0'),timeStr=toBanglaNum(h)+':'+toBanglaNum(mm)+' '+ampm,dateStr=toBanglaNum(now.getDate())+' '+months[now.getMonth()]+' '+toBanglaNum(now.getFullYear());let lines=['আজকের হিসাব','প্রিন্ট করা হয়েছে: '+dateStr+', '+timeStr,'--------------------------------'];if(entries.length===0)lines.push('কোনো এন্ট্রি নেই।');else entries.forEach(e=>lines.push(e.name+'  '+fmtAmt(e.amount)));lines.push('--------------------------------');const total=entries.reduce((s,e)=>s+Number(e.amount||0),0);lines.push('মোট: '+fmtAmt(total));return lines.join('\n')}
function utf8ToBase64(str){return btoa(unescape(encodeURIComponent(str)))}
document.getElementById('rawbtBtn').addEventListener('click',()=>{const b64=utf8ToBase64(buildReceiptText()+'\n\n\n');const url='intent:base64,'+b64+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';try{window.location.href=url}catch(e){document.getElementById('textBtn').click()}});
document.getElementById('textBtn').addEventListener('click',()=>{const ta=document.getElementById('receiptText');ta.value=buildReceiptText();document.getElementById('modalStatus').textContent='';document.getElementById('modalOverlay').classList.add('open')});
document.getElementById('closeModalBtn').addEventListener('click',()=>document.getElementById('modalOverlay').classList.remove('open'));
document.getElementById('copyBtn').addEventListener('click',()=>{const ta=document.getElementById('receiptText'),statusEl=document.getElementById('modalStatus');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);function done(msg){statusEl.textContent=msg}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>done('কপি হয়েছে ✓ — এখন প্রিন্টার অ্যাপে পেস্ট করুন।')).catch(()=>{try{const ok=document.execCommand('copy');done(ok?'কপি হয়েছে ✓ — এখন প্রিন্টার অ্যাপে পেস্ট করুন।':'পুরো টেক্সট সিলেক্ট করা আছে — এখন লম্বা-চাপ দিয়ে কপি করুন।')}catch(e){done('পুরো টেক্সট সিলেক্ট করা আছে — এখন লম্বা-চাপ দিয়ে কপি করুন।')}})}else{try{const ok=document.execCommand('copy');done(ok?'কপি হয়েছে ✓ — এখন প্রিন্টার অ্যাপে পেস্ট করুন।':'পুরো টেক্সট সিলেক্ট করা আছে — এখন লম্বা-চাপ দিয়ে কপি করুন।')}catch(e){done('পুরো টেক্সট সিলেক্ট করা আছে — এখন লম্বা-চাপ দিয়ে কপি করুন।')}}});
document.getElementById('printBtn').addEventListener('click',()=>{updatePrintStamp();try{window.print()}catch(e){}});
let clearArmed=false,clearTimer=null;const clearBtn=document.getElementById('clearBtn');clearBtn.addEventListener('click',()=>{if(!clearArmed){clearArmed=true;clearBtn.textContent='নিশ্চিত? আবার চাপুন';clearTimer=setTimeout(()=>{clearArmed=false;clearBtn.textContent='আজকের তালিকা মুছুন'},3000)}else{clearTimeout(clearTimer);clearArmed=false;clearBtn.textContent='আজকের তালিকা মুছুন';data[key]=[];saveAll(data);render()}});render();
})();
</script>
</body>
</html>
